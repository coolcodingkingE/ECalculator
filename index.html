<!DOCTYPE html>
	<html>
	    <head>
		<meta charset="utf-8">
		   <title>Calculator</title>
		<link href= "resources/css/reset.css" rel="stylesheet" type="text/css"/>
		<link href= "https://fonts.googleapis.com/css?family=Open+Sans" rel="stylesheet"/>
		<link href= "resources/css/style.css" rel= "stylesheet" type="text/css"/>																	<link rel= "icon" href = "resources/images.jpeg" type="image/x-icon">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
	   </head>
<body class="color">


<header>
<div class=logo>
<img src="./resources/images.jpeg"/>
</div>
</header>


<h1>Calculator!</h1>

<div id="calculator">
<div id="screen"> </div>
<div id="controls">
<div class="other"> </div>
</div>
<div id="numbers">
<div class="number">1</div>
<div class="number">2</div>
<div class="number">3</div>
<div class="number">4</div>
<div class="number">5</div>
<div class="number">6</div>
<div class="number">7</div>
<div class="number">8</div>
<div class="number">9</div>
<div class="number">0</div>

</div>
<div id="operators">
<div class="operator" id="plus">+</div>
<div class="operator" id="minus">-</div>
<div class="operator" id="multiply">x</div>
<div class="operator" id="divide">÷</div>
</div>
<div id="other-operators">
<div class="operator" id="equal">=</div>
<div class="operator" id="clear">C</div>
</div>

<script src= "https://cdnjs.cloudflare.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>
<script type="text/javascript" src="resources/js/script.js"></script>

</body>
</html>
